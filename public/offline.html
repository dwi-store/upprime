<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080807">
  <title>UPPRIME — Sedang Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080807;color:#f5f7ff;font-family:Arial,Helvetica,sans-serif;text-align:center}
    main{max-width:420px;padding:32px;border:1px solid #443822;border-radius:22px;background:#15120d}
    h1{margin:0 0 12px;font-size:28px}p{color:#b4ad9d;line-height:1.7}
    button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#b88b32;color:white;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>UPPRIME</h1>
    <p>Koneksi internet sedang tidak tersedia. Hubungkan kembali perangkatmu untuk melihat katalog, masuk ke akun, dan memproses pesanan.</p>
    <button onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
